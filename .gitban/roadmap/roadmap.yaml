          codex-native-hooks-upgrade:
            id: codex-native-hooks-upgrade
            title: Upgrade the Codex adapter to the stable Codex hook event set
            description: "OpenAI Codex graduated hooks to stable. peon-ping's Codex
              adapter still consumes only the legacy `notify` callback, which fires
              solely when the agent yields its turn — so Codex users effectively only
              ever hear a 'done' sound and miss session-start greetings, permission/approval
              prompts, and tool-failure cues. Subscribing to the full Codex hook event
              set brings Codex to event parity with the first-class Claude Code experience
              (#513). Current state (verified vs origin/main): adapters/codex.sh collapses
              almost everything to Stop with narrow special cases; adapters/codex.ps1
              is thinner (switch on a single $Event param, NO stdin parsing) and even
              collapses error/fail* to Stop. Detection already keys on the codex adapter
              path string, so a hooks-based registration that references it would
              still be detected — the real gap is event coverage, not status."
            status: done
            priority: high
            sequence: 2
            features:
              codex-hooks-event-mapping:
                id: codex-hooks-event-mapping
                title: Map the stable Codex hook event set to CESP in codex.sh
                status: done
                priority: high
                sequence: 1
                description: 'From the Codex hooks docs, enumerate the stable hook
