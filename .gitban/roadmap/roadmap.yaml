      s7:
        id: s7
        title: Peon audio is a good citizen — it mixes with your music, fades
          smoothly, and any sound is one command away
        description: "Makes peon-ping's audio output polite and scriptable. Today
          peon plays each sound fire-and-forget per platform (afplay / scripts/peon-play.swift
          on macOS, MediaPlayer via scripts/win-play.ps1 on native Windows + an inline
          powershell.exe block on WSL2, the pw-play→paplay→ffplay→mpv→play→aplay chain
          in play_linux_sound() on Linux), with no declared mixing intent, no fade
          envelope, and no way to play one specific file. On macOS, peon-play.swift
          routes through the default system output via AVAudioEngine but never declares
          mixing, so a ping can pause Spotify on a Bluetooth/AirPlay route (#371).
          Sounds start/stop abruptly (#394), and `peon preview` only plays whole categories
          (#345). Divergence note: upstream PR #501 added --media-role=Notification
          to pw-play but is NOT on this fork's main, so the Linux portion is partly
          a rebase plus extension. Architecture note for carding: the native Windows
          hook engine is NOT a tracked file — it is embedded as a here-string in install.ps1
          and tested via tests/peon-engine.Tests.ps1; Windows engine edits land in
          install.ps1."
        status: todo
        success_criteria:
          - A peon sound playing while media is active does NOT pause or seize
            the output device on macOS (incl. Bluetooth/AirPlay), native
            Windows, WSL2, and Linux — verified manually per platform and
            asserted via backend-flag tests (BATS + Pester)
          - New config keys (audio_coexist, optional duck_others; fade_in_ms /
            fade_out_ms) exist in config.json, are backfilled by `peon update`
            and the install.ps1 engine migration, documented in all README
            variants + docs/public/llms.txt, and covered by BATS + Pester
          - Configurable fade-in/out is applied by every backend that can
            (AVAudioEngine ramp, MediaPlayer volume-ramp loop, ffmpeg afade for
            ffplay/mpv) with documented best-effort no-op for backends that
            cannot (afplay, paplay, pw-play, play, aplay)
          - '`peon play <pack/file | category>` plays a single sound on macOS, WSL2,
            Linux, native Windows, and SSH/devcontainer, is registered in completions.bash/.fish,
            documented in all README variants + llms.txt, and covered by BATS + Pester'
          - 'Windows RDP audio routing is investigated and documented: either audible
            over a focused RDP session or a clear known-limitation note plus any workaround,
            surfaced via SESSIONNAME detection in status/debug'
        sequence: 2
        projects:
          audio-coexistence-routing:
            id: audio-coexistence-routing
            title: 'Audio coexistence: mix, never seize the output device'
            description: 'A cross-platform audio-coexistence layer so peon sounds
              mix with whatever the user is already listening to instead of grabbing
              an exclusive output route. The most-cited complaint about peon-ping
              is that it interrupts music; fixing it durably (a coexistence policy,
              not a one-off patch) is core to making peon something people leave on
              all day. Sources: #371 (Spotify/Bluetooth interruption), #219 (RDP routing,
              niche), #499/#501 (Linux notification role). Current state (verified):
              peon-play.swift sets engine.mainMixerNode.outputVolume once but never
              declares an AVAudioSession/mixing category; win-play.ps1 + the WSL block
              use MediaPlayer with no explicit shared/exclusive declaration (shared
              by default — needs verification + comment); play_linux_sound() passes
              only volume flags with NO role/duck hint (the #501 pw-play role fix
              is absent from this fork). No tests assert non-exclusive playback. RDP
              (#219): no SESSIONNAME/console-vs-RDP awareness anywhere. NOTE: #219
              is intentionally a single low-priority investigation project inside
              this feature, not its own roadmap node.'
            status: todo
            priority: high
            sequence: 1
            features:
              macos-mixwithothers:
                id: macos-mixwithothers
                title: 'macOS: declare non-interrupting mixing in peon-play.swift'
                status: todo
                priority: high
                sequence: 1
                description: 'In scripts/peon-play.swift, before engine.start(), ensure
                  playback does not seize the route. On macOS AVAudioSession is iOS-only,
