              window and/or in-flight cap in .state.json) so concurrent sessions collapse
              to a sane number of lines while notifications/tab-titles are preserved.
              State writes are already atomic, so no new locking primitive is needed.
              The maintainer flagged audio-backend serialization as on the radar.
