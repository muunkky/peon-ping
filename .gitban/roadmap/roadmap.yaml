          pending-decision-reminders:
            id: pending-decision-reminders
            title: Re-notify reminders for unacknowledged decisions
            description: "An opt-in capability to RE-notify the user about a pending
              decision (permission/approval, input required, or idle) after a configurable
              delay, repeating up to a cap, until acknowledged. peon-ping's core promise
              is 'don't make the user babysit the terminal' — yet today a permission
              prompt is announced exactly once and the IDE's idle re-fires are actively
              suppressed (suppress_idle_prompt_repeats). A user who steps away misses
              the ping and the agent stalls indefinitely (#284). The design respects
              the hook-driven, no-daemon/no-cron architecture: re-notification piggybacks
              on subsequent hook events (the trainer's last_reminder_ts pattern),
              with an optional opt-in background watcher for the no-further-hooks
              case (precedent: the antigravity adapter's sleep loop). Acknowledgement
              is detected by a subsequent UserPromptSubmit/Stop/PreToolUse/PostToolUse
              for that session — the same signals the auto-dismiss block already uses.
              #284 OPEN; no merged PR addresses it."
            status: todo
            priority: high
            sequence: 2
            features:
              reminder-state-machine-design:
                id: reminder-state-machine-design
                title: Pending-decision state machine + ack detection in peon.sh
                status: todo
                priority: high
                sequence: 1
                description: Implement durable per-session pending-decision
                  tracking in .state.json
                  (state['pending_decisions'][session_id] = {category, first_ts,
                  last_notify_ts, repeats, kind}). On a decision-needing event —
                  PermissionRequest, Notification/permission_prompt,
                  Notification/idle_prompt and elicitation_dialog —
                  record/refresh the pending entry. On an acknowledgement event
                  — reuse the existing auto-dismiss signal set _dismiss_events
                  (UserPromptSubmit/Stop/PreToolUse/PostToolUse/PostToolUseFailure/Notification)
                  for the same session — clear the entry. Prune stale entries by
                  the idle window. Write atomically via the existing state-write
                  helper with lock-retry. Apply the session_id-empty guard so
                  sessions without an id do not share a bucket. Add BATS tests
                  feeding a PermissionRequest then a Stop, asserting the pending
                  entry is created then cleared, and that an unrelated session
                  does not cross-clear.
              reminder-delivery-hook-piggyback:
                id: reminder-delivery-hook-piggyback
                title: Hook-piggyback re-notify with delay + repeat cap +
                  min-gap
                status: todo
                priority: high
                sequence: 2
                depends_on:
                  - reminder-state-machine-design
                description: "Implement re-notification using the trainer's proven
                  hook-piggyback model (last_reminder_ts; reminder_interval_minutes/reminder_min_gap_minutes;
                  the interval/min-gap throttle). On every hook invocation for a session
                  that has a pending decision, check whether now - last_notify_ts
                  >= reminder_delay_seconds and repeats < reminder_max_repeats; if
                  so, re-emit the notification (notify='1' + appropriate notify_color/msg
                  via notification_message) and bump last_notify_ts/repeats. This
                  re-notifies whenever ANY hook fires (including the IDE's own ~60s
                  idle_prompt pokes). Add a sub-option to RE-ENABLE the currently-suppressed
                  idle_prompt repeats when reminders are on, by gating the suppression
                  condition on the new reminders config so re-notify and suppress_idle_prompt_repeats
                  do not fight. Add BATS tests asserting: first ping immediate, second
                  ping only after the configured delay, no ping past the cap, and
                  that an ack stops further pings."
              reminder-windows-engine-parity:
                id: reminder-windows-engine-parity
                title: Windows engine parity for reminders (install.ps1 +
                  Pester)
                status: todo
                priority: high
                sequence: 3
                depends_on:
                  - reminder-state-machine-design
                  - reminder-delivery-hook-piggyback
                description: 'Port the pending-decision tracking, ack detection, and
                  hook-piggyback re-notify to the native Windows engine generated
                  from the install.ps1 here-string. Mirror the state-machine reads/writes
                  against .state.json, the ack-event set, and the delay/cap/min-gap
                  throttle in PowerShell. Add Pester coverage in tests/peon-engine.Tests.ps1
                  using New-PeonTestEnvironment with -StateOverrides and -ConfigOverrides
                  to enable reminders: feed a permission event then a resume event
                  and assert the pending entry is created, re-notified after the delay,
                  and cleared on ack.'
              reminder-optional-background-watcher:
                id: reminder-optional-background-watcher
                title: Optional lightweight background watcher for active
                  re-notify (no-daemon-safe)
                status: todo
                priority: low
                sequence: 4
                depends_on:
                  - reminder-state-machine-design
                  - reminder-delivery-hook-piggyback
                description: "OPTIONAL, opt-in. Because hook-piggyback only fires
                  when the IDE emits an event, add an opt-in background watcher for
                  the case where no further hooks arrive (a permission prompt with
                  the IDE fully idle). Model it on the antigravity adapter's loop
                  (while true; do sleep N; check_pending; done, cleanup via kill 0,
                  trap, PEON_ADAPTER_TEST guard). The watcher reads .state.json pending_decisions,
                  applies the same delay/cap/min-gap logic, and triggers the notify
                  path (reusing notify.sh / the same audio+desktop+mobile delivery).
                  Spawn it lazily (nohup background, single instance guarded by a
                  PID file like relay.sh's .relay.pid) only when reminders are enabled,
                  and self-exit when no pending decisions remain so no process lingers.
                  Add a BATS test that sources the watcher in test mode and asserts
                  it re-fires for a stale pending entry and exits when cleared. PRIORITY
                  DELIBERATELY LOW: the hook-piggyback path already covers the common
                  case because the IDE keeps emitting idle_prompt pokes; this watcher
                  carries lingering-process risk and should ship only if the piggyback
                  path proves insufficient."
              reminder-cli-config-enforcement-docs:
                id: reminder-cli-config-enforcement-docs
                title: reminders config keys + CLI + migration + docs
                status: todo
                priority: medium
                sequence: 5
                depends_on:
                  - reminder-delivery-hook-piggyback
                  - reminder-windows-engine-parity
                description: "Add config keys following the trainer's nested shape,
                  e.g. reminders: { enabled:false, delay_seconds:120, max_repeats:3,
                  min_gap_seconds:60, kinds:['permission','idle'] }. Wire the full
                  enforcement chain: add to config.json defaults (enabled:false so
                  behavior is unchanged); backfill in the `peon update` migration
                  chain following the `if 'reminders' not in cfg` pattern AND the
                  install.ps1 engine migration block; add a `peon reminders <on|off|status>`
                  (and optional delay/repeats setters) CLI command in the peon.sh
                  dispatch alongside the existing top-level subcommands, mirrored
                  to completions.bash/.fish/.zsh; document in README.md (new 'Reminder
                  notifications' subsection), README_zh.md, and docs/public/llms.txt.
                  Add a BATS test asserting `peon update` backfills the key and `peon
                  reminders on/off` round-trips, plus a Pester test for the engine
                  migration. Reference #284 in CHANGELOG under Added and bump version
                  (minor)."
