      s8:
        id: s8
        title: Concurrent and headless agents stay quiet without silencing your
          own session
        description: "When a developer runs Claude Code agent teams, background/headless
          agents, or several concurrent instances, peon-ping today either pile-drives
          them with overlapping voice lines or silences everything indiscriminately.
          The hook fires fire-and-forget audio per invocation with no cross-process
          serialization or lock (confirmed: zero flock/lockfile patterns in peon.sh);
          the only headless guard is a single bash check for CLAUDE_CODE_ENTRYPOINT=sdk-cli
          with no Windows counterpart and no CLAUDE_CODE_HEADLESS handling; and there
          is no lead-vs-teammate distinction because agent-teams teammates are full
          top-level sessions whose Stop events are indistinguishable from the lead's.
          Platform note (corrects CLAUDE.md, which is stale): there is NO peon.ps1
          on canonical main — the native Windows hook engine is generated as a here-string
          inside install.ps1 (hook mode ~line 2400). This milestone makes peon-ping
          behave sanely under concurrency — the interactive/lead session stays audible,
          teammates and headless/background agents stay quiet, simultaneous events
          from different sessions are debounced/capped instead of stacking — and closes
          the Windows-engine parity gaps in the existing suppression knobs."
        status: todo
        success_criteria:
          - A single config flag silences agent-teams teammates while the team
            lead/first interactive session stays audible, with the lead identity
            recorded durably in .state.json (atomic temp+rename) and surviving
            across hook invocations
          - Headless/background agents (both CLAUDE_CODE_ENTRYPOINT=sdk-cli and
            CLAUDE_CODE_HEADLESS=true) are suppressed by default on BOTH peon.sh
            and the install.ps1-generated Windows engine, with a single
            PEON_ALLOW_HEADLESS escape hatch honored on both
          - Simultaneous task.complete/input.required events from N concurrent
            sessions produce at most a bounded number of voice lines within a
            short window (cross-process cooldown/cap in .state.json), not N
            overlapping lines, while desktop/mobile notification and tab-title
            behavior are preserved
          - 'Windows engine reaches parity with peon.sh on existing multi-agent knobs:
            the agent_modes set ({delegate, dangerouslySkipPermissions}), config-gated
            delegate suppression, subagent_sessions tracking + suppress_subagent_complete,
            and silent SubagentStart (Windows currently plays task.acknowledge)'
          - Every new config key is backfilled by the peon update migration
            chain AND the install.ps1 update migration block, documented in
            README.md + README_zh.md + docs/public/llms.txt, and covered by BATS
            + Pester
        sequence: 3
        projects:
          unified-headless-suppression:
            id: unified-headless-suppression
            title: Unified headless/background-agent suppression across both
              hook engines
            description: 'A single, generalized headless-detection gate that silences
              non-interactive Claude sessions (background agents, claude -p, SDK/headless
              runs) on both peon.sh and the install.ps1-generated Windows engine,
              behind one escape hatch. Background/headless agents are exactly the
              sessions a human is NOT watching, so their sounds are pure noise. The
              user-submitted #511 patch only addressed one env var on one engine;
              the strategic version unifies the entrypoint AND env-var signals across
              both engines with a shared test matrix, and is the foundation the teammate-suppression
              and concurrency features build on (same early-exit routing point). Current
              state (verified): peon.sh has the ONLY guard (~lines 3728-3729: PEON_ALLOW_HEADLESS!=1
              && CLAUDE_CODE_ENTRYPOINT=sdk-cli → exit 0); it does NOT check CLAUDE_CODE_HEADLESS.
              BATS coverage at tests/peon.bats:220-242. The install.ps1 Windows engine
              has NO entrypoint/headless check at all. #511 OPEN; no merged PR addresses
              it.'
            status: todo
            priority: high
            sequence: 1
            features:
              headless-bash-generalize:
                id: headless-bash-generalize
                title: Generalize peon.sh headless guard to cover
                  CLAUDE_CODE_HEADLESS
                status: todo
                priority: high
                sequence: 1
                description: "Edit the guard at peon.sh ~lines 3728-3729 to suppress
                  when EITHER CLAUDE_CODE_ENTRYPOINT=sdk-cli OR CLAUDE_CODE_HEADLESS
                  is truthy (case-insensitive 'true'/'1'), still gated by PEON_ALLOW_HEADLESS!=1,
                  keeping it before the stdin read so headless runs exit cheaply.
                  Add BATS tests in tests/peon.bats adjacent to the existing block
                  at 220-242: 'CLAUDE_CODE_HEADLESS=true suppresses sound', 'CLAUDE_CODE_HEADLESS=false
                  plays', 'PEON_ALLOW_HEADLESS=1 overrides CLAUDE_CODE_HEADLESS'.
