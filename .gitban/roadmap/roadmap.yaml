                  using New-PeonTestEnvironment (creates 'peon' and 'sc_kerrigan'
                  packs) plus -ConfigOverrides to define a custom pack spanning both
                  packs, asserting only listed cross-pack files play and no-repeat
                  holds."
              custom-pack-relay-parity:
                id: custom-pack-relay-parity
                title: Relay parity for custom packs (SSH/devcontainer)
                status: todo
                priority: medium
                sequence: 5
                depends_on:
                  - custom-pack-schema-and-resolver
                description: "Make the HTTP relay honor custom packs so remote sessions
                  get the same composed set. relay.sh already replicates single-pack
                  selection (active_pack from config, single packs/<active_pack> dir)
                  and the disabled_sounds filter, with no-repeat via last_played.
                  Extend the relay's Python selection block to resolve a custom pack's
                  per-entry {pack,file} refs against the correct local packs/<pack>
