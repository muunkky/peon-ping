          windows-engine-suppression-parity:
            id: windows-engine-suppression-parity
            title: Windows engine parity for existing multi-agent suppression
              knobs
            description: "The install.ps1-generated Windows engine has drifted from
              peon.sh on the suppression knobs the multi-agent features depend on.
              peon.sh recognizes agent_modes={'delegate','dangerouslySkipPermissions'},
              gates delegate suppression behind suppress_delegate_sessions, tracks
              subagent_sessions, honors suppress_subagent_complete on Stop/PermissionRequest/SubagentStop,
              and stays SILENT on SubagentStart. The Windows engine only knows 'delegate',
              applies delegate suppression UNCONDITIONALLY (no config gate), has NO
              subagent_sessions tracking or suppress_subagent_complete handling, and
              PLAYS a task.acknowledge sound on SubagentStart instead of staying silent.
              Same config → different behavior on Windows, which undermines the new
              headless/team/concurrency features that assume a consistent baseline.
              Closing it is foundational cross-platform hygiene. Prior art: merged
              PR #399 added SubagentStop suppression on the bash side only — Windows
              was never brought to parity. #481/#511 OPEN."
            status: todo
            priority: high
            sequence: 4
            features:
              windows-agent-modes-gate:
                id: windows-agent-modes-gate
                title: Match agent_modes set and gate delegate suppression by
                  config on Windows
                status: todo
                priority: high
                sequence: 1
                description: "In the install.ps1 engine, change $_agentModes (install.ps1:2631)
                  to @('delegate','dangerouslySkipPermissions') for parity with peon.sh
                  ~3790, and gate the suppression block at install.ps1:2634-2640 behind
                  the suppress_delegate_sessions config flag (read from $config, matching
                  peon.sh ~3931). When the flag is off, do not add the session to
                  agent_sessions and do not early-exit. Add Pester cases to tests/peon-engine.Tests.ps1:
                  delegate suppressed only when the flag is on; dangerouslySkipPermissions
                  recognized; normal perm mode never suppressed."
              windows-subagent-tracking:
                id: windows-subagent-tracking
                title: Add subagent_sessions tracking +
                  suppress_subagent_complete + silent SubagentStart to Windows
                  engine
                status: todo
                priority: high
                sequence: 2
                depends_on:
                  - windows-agent-modes-gate
                description: 'Bring the Windows engine to parity on subagent handling:
                  (1) change the SubagentStart case (install.ps1:2761) to stay SILENT
                  (no task.acknowledge) and instead record the subagent-pack-inheritance
                  / subagent_sessions state, mirroring peon.sh (SubagentStart records
                  pending_subagent_pack and stays silent; subagent_sessions populated
                  with ~300s TTL pruning); (2) add a SubagentStop case to the switch
                  block; (3) read suppress_subagent_complete from $config and suppress
                  the Stop / PermissionRequest / SubagentStop SOUND when the session
                  is a known subagent, mirroring peon.sh; (4) extend the SessionEnd
                  cleanup to drop subagent_sessions entries. Add Pester cases covering:
                  subagent Stop suppressed when flag on, plays when off, TTL expiry,
                  and SubagentStart no longer plays a sound (update the existing Scenario
                  at tests/peon-engine.Tests.ps1:360 which currently asserts SubagentStart
                  plays task.acknowledge).'
              windows-parity-status-and-assertion:
                id: windows-parity-status-and-assertion
                title: Windows status output + parity assertion test
                status: todo
                priority: medium
                sequence: 3
                depends_on:
                  - windows-subagent-tracking
                description: Ensure the `peon status`-equivalent output on the
                  Windows engine reflects suppress_subagent_complete and
                  suppress_delegate_sessions (parity with peon.sh). Add a Pester
                  parity test in tests/peon-engine.Tests.ps1 asserting the
                  Windows engine recognizes the same agent_modes set and honors
                  the same two config flags as peon.sh, so future drift is
                  caught in Windows CI. No new config keys (these already
                  exist), so no migration-chain change is required, but verify
                  the install.ps1 update migration block does not strip them.
      s9:
        id: s9
        title: Curate a personal cross-pack sound set and never miss a pending
          decision
        description: "Covers two long-standing personalization/attention gaps, both
          verified unshipped against origin/main and both still-open issues (#175,
          #284). Today sound selection is strictly single-pack-per-event: resolve_active_pack()
          returns exactly one pack, the runtime loads one manifest, chooses within
          one category's sounds array with no-repeat, and a realpath sandbox confines
          the file to a single pack root. The only personalization knob is SUBTRACTIVE:
          disabled_sounds (shipped in PR #502, merged 2026-04-29). There is no ADDITIVE
          way to assemble a favourite set of specific lines drawn from multiple packs
          (#175). Separately, when a prompt needs a human decision, it fires once
          and the IDE's ~60s idle re-fires are actively suppressed — so a pending
          approval the user walks away from is announced once and never again (#284).
          This milestone makes both real with full cross-platform parity (peon.sh
          + the install.ps1 here-string engine + relay.sh), the standard config-enforcement
          chain, and the no-daemon hook-driven constraint respected via hook-piggyback
          re-notification (mirroring the trainer's last_reminder_ts pattern)."
        status: todo
        success_criteria:
          - A user can define a custom/virtual pack mapping CESP categories to
            specific {pack,file} line references drawn from two or more
            installed packs, select it as the active pack, and hear ONLY those
            lines with no-repeat working across the cross-pack set — verified on
            macOS (BATS) and Windows (Pester) and honored over the
            SSH/devcontainer relay
          - 'The compose feature reuses and composes cleanly with the existing disabled_sounds
            subtractive filter (PR #502) rather than forking sound selection: a custom
            set still respects per-line disables, and `peon sounds list` understands
            custom packs'
          - When a prompt needs a decision (PermissionRequest / input.required /
            idle_prompt) and remains unacknowledged, peon-ping re-notifies after
            a configurable delay, repeating up to a cap, and stops as soon as
            the decision is acknowledged (a subsequent
            UserPromptSubmit/Stop/PreToolUse/PostToolUse for that session) —
            within the hook-driven, no-daemon architecture
          - Both features add config keys backfilled by `peon update` AND the
            install.ps1 engine migration, with matching BATS and Pester
            coverage, documented in README.md, README_zh.md, and
            docs/public/llms.txt
          - New/changed CLI surface (e.g. `peon packs custom ...`, `peon
            reminders ...`) is wired into completions.bash/.fish/.zsh, README
            (all variants), and has BATS + Pester tests
        sequence: 4
        projects:
          cross-pack-sound-composition:
            id: cross-pack-sound-composition
            title: Cross-pack custom sound sets (compose-your-own pack)
            description: "An ADDITIVE personalization capability letting a user assemble
              a personal set of specific voice lines drawn from MULTIPLE installed
              packs — e.g. three chosen lines from three different packs — and use
              only those. The complement to the already-shipped subtractive disabled_sounds
              toggles (PR #502). peon-ping's value is character/voice personality,
              and #175 wants to curate a bespoke persona rather than accept a whole
              pack or merely subtract lines. This turns peon from 'pick one of N packs'
              into 'compose your own pack'. Current state (verified single-pack-per-event
              on origin/main): resolve_active_pack() returns one pack; the runtime
              loads one manifest and chooses within one category's sounds array with
              no-repeat; the realpath sandbox confines a chosen file to a single pack_root;
              the icon-resolution chain resolves against that same single pack_dir.
              No virtual/custom pack or cross-pack picklist exists. #175 OPEN."
            status: todo
            priority: high
            sequence: 1
            features:
              custom-pack-schema-and-resolver:
                id: custom-pack-schema-and-resolver
                title: Define custom-pack schema + cross-pack-aware sound
                  resolver in peon.sh
                status: todo
                priority: high
                sequence: 1
                description: "Design a 'custom pack' as a config-defined virtual pack:
                  add a config key (e.g. custom_packs: { <name>: { <category>: [ {pack,
                  file} | {pack, file, label} ] } }). Recommend the config-key approach
                  over a generated packs/<name>/openpeon.json to avoid registry/download
                  coupling. In peon.sh, make resolve_active_pack() able to return
                  a custom-pack name through the same 5-tuple it already returns,
                  and refactor the runtime selection block so that when active_pack
                  is a custom pack it reads the category's list of {pack,file} refs
                  instead of a single manifest's sounds array, resolves each file
                  under ITS OWN packs/<pack> root, and applies the existing no-repeat
                  logic (last_played[category]) across the cross-pack candidate set.
                  CRITICAL: extend the realpath sandbox to validate each candidate
                  against the correct per-entry pack_root, not a single pack_root
                  — this is the load-bearing security check. The icon-resolution chain
                  must also use the per-entry pack dir. Add BATS coverage in tests/peon.bats
                  with a fixture custom pack referencing >=2 mock packs, asserting
                  only listed files are eligible and no-repeat holds across packs."
              custom-pack-compose-with-disabled-sounds:
                id: custom-pack-compose-with-disabled-sounds
                title: Compose custom packs with the disabled_sounds subtractive
                  filter
                status: todo
                priority: medium
                sequence: 2
                depends_on:
                  - custom-pack-schema-and-resolver
                description: 'Ensure the additive custom-pack path and the subtractive
                  disabled_sounds path (PR #502) compose rather than conflict. Semantics:
                  a {pack,file} entry in a custom set is still skipped if that file
                  is listed in disabled_sounds[pack][category]. Update the candidate-filtering
                  step in the new resolver so disabled_sounds is applied per SOURCE
                  pack of each entry (each entry carries its own pack key). Update
                  `peon sounds list` so that when given a custom pack name it lists
                  the composed entries grouped by source pack and marks disabled ones
                  with the existing disabled marker. Add BATS tests asserting (a)
                  a disabled cross-pack line is excluded from a custom set, and (b)
                  `peon sounds list <custom>` renders source-pack attribution.'
              custom-pack-cli:
                id: custom-pack-cli
                title: peon packs custom CLI (create/add/remove/list/use)
                status: todo
                priority: high
                sequence: 3
                depends_on:
                  - custom-pack-schema-and-resolver
                description: 'Add a CLI surface to build custom packs without hand-editing
                  config: `peon packs custom create <name>`, `peon packs custom add
                  <name> <category> <pack> <file>`, `peon packs custom remove ...`,
                  `peon packs custom list [name]`, and ensure `peon packs use <name>`
                  accepts a custom pack. Implement inside the existing `packs)` dispatch
                  in peon.sh (the case block routes via `case "${2:-}"`); add a new
                  `custom)` subcase. Per the change-enforcement chain: update completions.bash,
                  completions.fish, and completions.zsh (all three exist; mirror the
                  #502 additions for `sounds`); add the commands to README.md CLI
                  reference, README_zh.md, and docs/public/llms.txt. Add BATS tests
                  for create/add/list round-trips and config persistence, and validate
                  that `peon packs custom list` errors cleanly on unknown names.'
              custom-pack-windows-engine-parity:
                id: custom-pack-windows-engine-parity
                title: Windows engine parity for custom packs (install.ps1 +
                  Pester)
                status: todo
                priority: high
                sequence: 4
                depends_on:
                  - custom-pack-schema-and-resolver
                  - custom-pack-compose-with-disabled-sounds
                description: "Port the cross-pack resolver (and, if implemented, the
                  CLI) to the native Windows runtime generated from the install.ps1
                  here-string ($hookScript = @'). Active-pack resolution is via Get-ActivePack;
                  the single packs\\$activePack manifest load and the disabled_sounds
                  filter + no-repeat ($lastKey) run nearby. Add custom-pack awareness:
                  when $activePack is a custom pack, read the config-defined {pack,file}
                  list for the category, resolve each via its own packs\\<pack> dir
