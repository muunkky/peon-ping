                  failure→PostToolUseFailure (carry tool_name+error, as the adapter
                  already does). Branch on input shape so BOTH paths keep working:
                  new hooks arrive as stdin JSON with a hook_event_name field, legacy
                  notify arrives as argv $1 — the adapter already reads both, so extend
                  the mapping rather than rewrite the I/O. Do NOT break existing `notify`
                  users. Keep the `codex-` prefix and existing field-extraction helpers.'
