              custom-pack-config-enforcement-and-docs:
                id: custom-pack-config-enforcement-and-docs
                title: Config migration backfill + docs for custom packs
                status: todo
                priority: medium
                sequence: 6
                depends_on:
                  - custom-pack-cli
                  - custom-pack-windows-engine-parity
                description: "Wire the new config key(s) (e.g. custom_packs) through
