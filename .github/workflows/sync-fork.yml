name: Sync fork with upstream

# Keeps muunkky/peon-ping main in lockstep with PeonPing/peon-ping so the fork
# never falls behind. Branch your feature work off origin/main anyway — this
# just keeps the fork tidy as a second line of defence.

on:
  schedule:
    - cron: "0 6 * * *"      # daily 06:00 UTC
  workflow_dispatch:          # also runnable on demand from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync main from upstream PeonPing/peon-ping
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh repo sync muunkky/peon-ping --branch main --source PeonPing/peon-ping
